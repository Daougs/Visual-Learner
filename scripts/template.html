<title>Day %%DAY%% Explainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one 16:9 "screen" printed in banknote ink, scaled with container units; page chrome follows the viewer's theme */
:root {
  --page: #eef2ef; --page-fg: #16302b; --muted: #55685f; --line: #c5d3ce; --btn: #ffffff;
  /* the stage keeps one deliberate look (banknote ink) in both themes */
  --ink: #0e2b27; --ink-2: #163d37; --ink-3: #1f4c44; --paper: #eef5f0; --dim: #9bb8b0;
  --gold: #f2b33d; --mint: #7fd6b2; --rose: #ff8a7a;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #0a1714; --page-fg: #e3ece8; --muted: #93aaa3; --line: #24413a; --btn: #12241f; color-scheme: dark } }
:root[data-theme="dark"] { --page: #0a1714; --page-fg: #e3ece8; --muted: #93aaa3; --line: #24413a; --btn: #12241f; color-scheme: dark }

body { background: var(--page); color: var(--page-fg); font-family: var(--body); }
.wrap { max-width: 1000px; margin: 0 auto; padding-block: 24px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.head h1 { font-family: var(--display); font-weight: 800; font-size: clamp(1.3rem, 3.4vw, 1.9rem); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.head p { margin: 0; color: var(--muted); font-size: 0.9rem; }

/* ---------- player ---------- */
.player { position: relative; container-type: inline-size; width: 100%; max-width: 100%; border-radius: 14px; overflow: hidden; background: var(--ink); }
.stage { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; background: var(--ink); color: var(--paper); overflow: hidden; cursor: pointer; }
.stage::before { content: ""; position: absolute; inset: 0; opacity: .08; pointer-events: none;
  background: repeating-radial-gradient(circle at 90% 118%, transparent 0 9px, var(--mint) 9px 10px); }
.stage::after { content: ""; position: absolute; inset: 1.4cqw; border: 1px solid rgba(127,214,178,.16); border-radius: 1cqw; pointer-events: none; }
.scene { position: absolute; inset: 0; padding: 5.5cqw 7cqw 12cqw; display: flex; flex-direction: column; justify-content: center; gap: 1.8cqw; opacity: 0; visibility: hidden; transition: opacity .35s ease, visibility 0s linear .35s; }
.scene.on { opacity: 1; visibility: visible; transition: opacity .35s ease; }
.eyebrow { font-family: var(--mono); font-size: max(9px, 1.45cqw); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.big { font-family: var(--display); font-weight: 800; font-size: 6cqw; line-height: 1.02; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.mid { font-family: var(--display); font-weight: 700; font-size: 3.5cqw; line-height: 1.12; margin: 0; text-wrap: balance; }
.note { font-size: max(10px, 1.85cqw); color: var(--dim); max-width: 64cqw; line-height: 1.4; margin: 0; }
.num { font-family: var(--mono); font-weight: 700; font-variant-numeric: tabular-nums; }
.gold { color: var(--gold); } .mint { color: var(--mint); } .rose { color: var(--rose); } .dim { color: var(--dim); }
.rv { opacity: 0; transform: translateY(1.2cqw); transition: opacity .45s ease, transform .45s ease; }
.rv.in { opacity: 1; transform: none; }
.mark { font-family: var(--display); font-weight: 800; font-size: 26cqw; position: absolute; right: 4cqw; bottom: -6cqw; color: var(--gold); opacity: .13; line-height: 1; pointer-events: none; }
.daytag { display: inline-flex; gap: 1cqw; align-items: center; font-family: var(--mono); font-size: max(9px, 1.4cqw); color: var(--mint); }
.daytag b { background: var(--gold); color: var(--ink); padding: .3cqw 1cqw; border-radius: .5cqw; }

/* shared building blocks */
.panel { background: var(--ink-2); border-radius: 1.3cqw; padding: 2cqw 2.4cqw; }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 1.6cqw; font-family: var(--mono); font-weight: 700; font-size: 4.6cqw; }
.eq .chip { padding: .5cqw 1.8cqw; border-radius: 1cqw; background: var(--ink-2); }
.eq small { display: block; font-family: var(--body); font-weight: 500; font-size: max(9px, 1.4cqw); color: var(--dim); text-align: center; margin-top: .4cqw; }
.hbar { display: grid; grid-template-columns: 22cqw 1fr 12cqw; align-items: center; gap: 1.6cqw; font-size: max(10px, 1.9cqw); }
.hbar .tr { height: 3cqw; background: var(--ink-3); border-radius: .6cqw; position: relative; overflow: hidden; }
.hbar .tr i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--mint); border-radius: .6cqw; }
.hbar .v { text-align: right; font-family: var(--mono); font-weight: 700; color: var(--gold); }
.bars { display: flex; flex-direction: column; gap: 1.4cqw; }
.tbl { width: 100%; border-collapse: collapse; font-size: max(9px, 1.7cqw); }
.tbl th { text-align: left; font-family: var(--mono); font-weight: 500; font-size: max(8px, 1.3cqw); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); padding: 0 1.2cqw .8cqw; border-bottom: 1px solid var(--ink-3); }
.tbl td { padding: .75cqw 1.2cqw; border-bottom: 1px solid var(--ink-2); }
.tbl td.r, .tbl th.r { text-align: right; }
.tbl tr.rv { transform: none; }
.tbl tr.hl td { background: rgba(242,179,61,.12); }
.checks { display: grid; gap: 1.5cqw; margin: 0; padding: 0; list-style: none; }
.checks li { display: grid; grid-template-columns: 3.4cqw 1fr; gap: 1.6cqw; align-items: start; font-size: max(11px, 2.3cqw); line-height: 1.3; }
.checks .box { width: 2.8cqw; height: 2.8cqw; border: .3cqw solid var(--gold); border-radius: .6cqw; margin-top: .1cqw; }
.cards { display: grid; gap: 2cqw; }
.card { background: var(--ink-2); border-radius: 1.3cqw; padding: 2.2cqw; display: grid; gap: .8cqw; align-content: start; }
.card .k { font-family: var(--mono); font-size: max(8px, 1.35cqw); color: var(--gold); letter-spacing: .08em; text-transform: uppercase; }
.card h3 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 3.1cqw; line-height: 1.05; }
.card p { margin: 0; font-size: max(9px, 1.65cqw); color: var(--dim); line-height: 1.35; }
.flow { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; gap: 1.4cqw; align-items: center; }
.flow .arrow { font-family: var(--mono); font-size: 3.2cqw; color: var(--gold); text-align: center; }
.flow .arrow small { display: block; font-size: max(8px, 1.3cqw); color: var(--dim); }
.chips { display: flex; flex-wrap: wrap; gap: 1cqw; }
.chips span { background: var(--ink-2); border-radius: 99px; padding: .6cqw 1.6cqw; font-size: max(9px, 1.6cqw); }
.sbar { display: flex; height: 6cqw; border-radius: 1cqw; overflow: hidden; background: var(--ink-3); width: 100%; }
.sbar i { display: flex; align-items: center; justify-content: center; font-style: normal; font-family: var(--mono); font-weight: 700; font-size: max(8px, 1.6cqw); color: var(--ink); width: 0; overflow: hidden; white-space: nowrap; }
.split2 { display: grid; grid-template-columns: 1fr 1fr; gap: 2cqw; }
.vs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2cqw; }
.stamp { display: inline-block; font-family: var(--mono); font-weight: 700; font-size: max(9px, 1.5cqw); letter-spacing: .12em; text-transform: uppercase; padding: .5cqw 1.2cqw; border: .25cqw solid currentColor; border-radius: .6cqw; transform: rotate(-4deg); }
/*%%CSS%%*/

/* caption + big play */
.cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 1.6cqw 7cqw 2.1cqw; font-size: max(11px, 1.9cqw); line-height: 1.35; background: linear-gradient(to top, rgba(6,22,19,.95) 55%, rgba(6,22,19,0)); color: var(--paper); min-height: 7.5cqw; display: flex; align-items: flex-end; pointer-events: none; }
.cap span { max-width: 80cqw; }
.bigplay { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; background: rgba(6,22,19,.25); transition: opacity .25s; }
.bigplay span { width: 10cqw; height: 10cqw; min-width: 48px; min-height: 48px; border-radius: 50%; background: var(--gold); display: grid; place-items: center; box-shadow: 0 0 0 1.3cqw rgba(242,179,61,.2); }
.bigplay svg { width: 38%; height: 38%; margin-left: 8%; }
.bigplay.off { opacity: 0; }

/* ---------- controls ---------- */
.controls { display: grid; gap: 10px; }
.bar-ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--btn); color: var(--page-fg); border-radius: 999px; padding: 8px 14px; font: 600 0.9rem var(--body); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; }
.btn.primary { background: var(--page-fg); color: var(--page); border-color: var(--page-fg); min-width: 92px; justify-content: center; }
.btn[aria-pressed="false"] { color: var(--muted); }
.btn:focus-visible, .seek:focus-visible, .chap:focus-visible, .stage:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.time { font-family: var(--mono); font-size: 0.85rem; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
.seek { position: relative; height: 12px; border-radius: 6px; background: var(--line); cursor: pointer; touch-action: none; }
.seek .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--gold); border-radius: 6px; pointer-events: none; }
.seek .tick { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--page); pointer-events: none; }
.chaps { display: flex; flex-wrap: wrap; gap: 6px; }
.chap { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 8px; padding: 6px 9px; font: 500 0.8rem var(--body); cursor: pointer; }
.chap b { font-family: var(--mono); font-weight: 500; margin-right: 4px; }
.chap.on { background: var(--page-fg); color: var(--page); border-color: var(--page-fg); }
.hint { font-size: 0.82rem; color: var(--muted); margin: 0; }

@media (max-width: 560px) {
  .flow { grid-template-columns: 1fr; } .flow .arrow { display: none; }
  .scene { padding: 4.5cqw 5.5cqw 5cqw; gap: 1.4cqw; }
  .cap { position: static; background: var(--ink); min-height: 0; padding: 10px 14px 12px; font-size: 13px; border-top: 1px solid var(--ink-2); }
  .cap span { max-width: none; }
  .stage::after { display: none; }
}
html.capture, html.capture body { margin: 0; padding: 0; background: #0e2b27; overflow: hidden; }
html.capture .wrap { display: block; max-width: none; padding: 0; }
html.capture .head, html.capture .controls { display: none; }
html.capture .player { border-radius: 0; width: 100vw; }
html.capture .bigplay { display: none; }
@media (prefers-reduced-motion: reduce) {
  .scene, .scene.on, .rv, .bigplay, .stage * { transition: none !important; animation: none !important; }
}
</style>

<div class="wrap">
  <div class="head">
    <h1>%%H1%%</h1>
    <p>%%SUB%%</p>
  </div>

  <div class="player">
    <div class="stage" id="stage" role="region" tabindex="0" aria-label="Explainer video. Click or press Space to play or pause.">
      %%SCENES%%
      <div class="bigplay" id="bigplay" aria-hidden="true"><span><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z" fill="#0e2b27"/></svg></span></div>
    </div>
    <div class="cap" id="cap" aria-live="polite"><span id="capt"></span></div>
  </div>

  <div class="controls">
    <div class="seek" id="seek" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div>
    <div class="bar-ctl">
      <button class="btn primary" id="play" type="button">Play</button>
      <button class="btn" id="restart" type="button">Restart</button>
      <button class="btn" id="voice" type="button" aria-pressed="true">Voiceover: on</button>
      <span class="time" id="time">0:00 / 0:00</span>
    </div>
    <div class="chaps" id="chaps" aria-label="Scenes"></div>
    <p class="hint">Space plays or pauses. Tap a scene to jump to it. Turn your sound on for the voiceover.</p>
  </div>
</div>
<audio id="nar" preload="auto" src="data:audio/mpeg;base64,%%AUDIO%%"></audio>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const ease = x => 1 - Math.pow(1 - x, 3);
  const P = (t, a, b) => ease(clamp((t - a) / (b - a)));
  const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
  const show = (id, on) => { const e = $(id); if (e) e.classList.toggle('in', !!on); };
  const seq = (pre, n, t, start, gap) => { for (let i = 0; i < n; i++) show(pre + i, t >= start + i * gap); };
  const txt = (id, s) => { const e = $(id); if (e && e.textContent !== s) e.textContent = s; };
  const w = (id, pct) => { const e = $(id); if (e) e.style.width = pct + '%'; };
  const h = (id, pct) => { const e = $(id); if (e) e.style.height = pct + '%'; };

  const SCENES = [
/*%%SCENEJS%%*/
  ];

  const starts = []; let acc = 0;
  SCENES.forEach(s => { starts.push(acc); acc += s.d; });
  const TOTAL = acc;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  const audio = $('nar'), stage = $('stage'), scenesEl = stage.querySelectorAll('.scene');
  let cur = -1, playing = false, started = false;

  const fmt = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const idxAt = t => { let i = 0; while (i < SCENES.length - 1 && t >= starts[i + 1]) i++; return i; };

  // scene ticks + scene buttons
  const seek = $('seek'), chaps = $('chaps');
  SCENES.forEach((s, i) => {
    if (i > 0) { const k = document.createElement('div'); k.className = 'tick'; k.style.left = (starts[i] / TOTAL * 100) + '%'; seek.appendChild(k); }
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chap'; b.id = 'chap' + i;
    b.innerHTML = '<b>' + (i + 1) + '</b>' + s.label;
    b.addEventListener('click', () => jump(starts[i] + 0.02));
    chaps.appendChild(b);
  });

  function frame(t) {
    t = clamp(t, 0, TOTAL);
    const i = idxAt(t);
    if (i !== cur) {
      scenesEl.forEach((el, k) => { el.classList.toggle('on', k === i); el.setAttribute('aria-hidden', k === i ? 'false' : 'true'); });
      chaps.querySelectorAll('.chap').forEach((b, k) => b.classList.toggle('on', k === i));
      txt('capt', SCENES[i].cap);
      cur = i;
    }
    const s = SCENES[i];
    const local = reduce.matches ? s.d : t - starts[i];
    try { s.render(local, s.r || s.d); } catch (e) { console.error(e); }
    $('fill').style.width = (t / TOTAL * 100) + '%';
    seek.setAttribute('aria-valuenow', Math.round(t / TOTAL * 100));
    seek.setAttribute('aria-valuetext', fmt(t) + ' of ' + fmt(TOTAL));
    txt('time', fmt(t) + ' / ' + fmt(TOTAL));
  }

  function loop() { if (!playing) return; frame(audio.currentTime); requestAnimationFrame(loop); }
  function setUI() {
    $('play').textContent = playing ? 'Pause' : (audio.currentTime >= TOTAL - 0.05 ? 'Replay' : (started ? 'Play' : 'Play'));
    $('bigplay').classList.toggle('off', playing);
  }
  function play() {
    if (audio.currentTime >= TOTAL - 0.05) audio.currentTime = 0;
    started = true;
    const p = audio.play();
    playing = true; setUI(); requestAnimationFrame(loop);
    if (p && p.catch) p.catch(() => { playing = false; setUI(); });
  }
  function pause() { audio.pause(); playing = false; setUI(); frame(audio.currentTime); }
  function toggle() { playing ? pause() : play(); }
  function jump(t) { audio.currentTime = clamp(t, 0, TOTAL - 0.01); frame(audio.currentTime); if (!started) { started = true; } setUI(); }

  $('play').addEventListener('click', toggle);
  stage.addEventListener('click', toggle);
  $('restart').addEventListener('click', () => { jump(0); if (!playing) play(); });
  $('voice').addEventListener('click', e => {
    audio.muted = !audio.muted;
    e.currentTarget.setAttribute('aria-pressed', String(!audio.muted));
    e.currentTarget.textContent = 'Voiceover: ' + (audio.muted ? 'off' : 'on');
  });
  audio.addEventListener('ended', () => { playing = false; frame(TOTAL); setUI(); });
  audio.addEventListener('seeked', () => { if (!playing) frame(audio.currentTime); });

  const seekTo = ev => { const r = seek.getBoundingClientRect(); jump(clamp((ev.clientX - r.left) / r.width) * TOTAL); };
  let dragging = false;
  seek.addEventListener('pointerdown', ev => { dragging = true; seek.setPointerCapture(ev.pointerId); seekTo(ev); });
  seek.addEventListener('pointermove', ev => { if (dragging) seekTo(ev); });
  seek.addEventListener('pointerup', () => { dragging = false; });
  seek.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowRight') { jump(audio.currentTime + 5); ev.preventDefault(); }
    if (ev.key === 'ArrowLeft') { jump(audio.currentTime - 5); ev.preventDefault(); }
    if (ev.key === 'Home') { jump(0); ev.preventDefault(); }
    if (ev.key === 'End') { jump(TOTAL - 0.5); ev.preventDefault(); }
  });
  document.addEventListener('keydown', ev => {
    if (ev.code !== 'Space' && ev.key !== ' ') return;
    const tag = (ev.target.tagName || '').toLowerCase();
    if (tag === 'button' || tag === 'input' || tag === 'textarea') return;
    ev.preventDefault(); toggle();
  });
  reduce.addEventListener && reduce.addEventListener('change', () => frame(audio.currentTime));

  // rest frame: title scene, fully drawn
  // capture mode (used to record the MP4): wall clock drives the timeline, no controls, no audio
  window.__capture = () => {
    document.documentElement.classList.add('capture');
    $('bigplay').classList.add('off');
    const t0 = performance.now();
    const tick = () => { const t = (performance.now() - t0) / 1000; frame(t); if (t < TOTAL) requestAnimationFrame(tick); else window.__done = true; };
    requestAnimationFrame(tick);
    return TOTAL;
  };
  frame(0);
  SCENES[0].render(SCENES[0].d, SCENES[0].d);
  setUI();
})();
</script>
